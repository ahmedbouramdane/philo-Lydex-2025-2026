<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Nabla:EDPT,EHLT@30..200,24&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Specific overrides for the landing page */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 8vw;
            font-family: 'Nabla', sans-serif;
            margin: 0;
            line-height: 1.2;
        }

        @font-palette-values --Nabla {
            font-family: Nabla;
            base-palette: 2;
        }

        .nabla-text span {
            animation: depth 1s ease-in-out alternate infinite;
            position: relative;
            display: inline-block;
            font-variation-settings: "EDPT" 30;
            font-palette: --Nabla;
        }

        /* Animation delays */
        .nabla-text span:nth-child(1) {
            animation-delay: 0.1s;
        }

        .nabla-text span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .nabla-text span:nth-child(3) {
            animation-delay: 0.3s;
        }

        .nabla-text span:nth-child(4) {
            animation-delay: 0.4s;
        }

        .nabla-text span:nth-child(5) {
            animation-delay: 0.5s;
        }

        .nabla-text span:nth-child(6) {
            animation-delay: 0.6s;
        }

        .nabla-text span:nth-child(7) {
            animation-delay: 0.7s;
        }

        .nabla-text span:nth-child(8) {
            animation-delay: 0.8s;
        }

        .nabla-text span:nth-child(9) {
            animation-delay: 0.9s;
        }

        .nabla-text span:nth-child(10) {
            animation-delay: 1.0s;
        }

        .nabla-text span:nth-child(11) {
            animation-delay: 1.1s;
        }

        .nabla-text span:nth-child(12) {
            animation-delay: 1.2s;
        }

        .nabla-text span:nth-child(13) {
            animation-delay: 1.3s;
        }

        .nabla-text span:nth-child(14) {
            animation-delay: 1.4s;
        }

        @keyframes depth {
            0% {
                transform: translatex(0) translatey(0);
            }

            100% {
                font-variation-settings: "EDPT" 200;
                transform: translatex(0.13em) translatey(0.1em);
            }
        }

        .lydex {
            text-align: center;
            margin-bottom: 50px;
        }

        /* Button Style */
        .cssbuttons-io-button {
            background: var(--accent-color);
            color: white;
            font-family: var(--font-main);
            padding: 0.35em;
            padding-left: 1.2em;
            font-size: 17px;
            font-weight: 500;
            border-radius: 0.9em;
            border: none;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            box-shadow: inset 0 0 1.6em -0.6em rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            height: 2.8em;
            padding-right: 3.3em;
            cursor: pointer;
            width: 200px;
            text-decoration: none;
            margin-top: 30px;
        }

        .cssbuttons-io-button .icon {
            background: white;
            margin-left: 1em;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 2.2em;
            width: 2.2em;
            border-radius: 0.7em;
            box-shadow: 0.1em 0.1em 0.6em 0.2em rgba(0, 0, 0, 0.1);
            right: 0.3em;
            transition: all 0.3s;
        }

        .cssbuttons-io-button:hover .icon {
            width: calc(100% - 0.6em);
        }

        .cssbuttons-io-button .icon svg {
            width: 1.1em;
            transition: transform 0.3s;
            color: var(--accent-color);
        }

        .cssbuttons-io-button:hover .icon svg {
            transform: translateX(0.1em);
        }

        .cssbuttons-io-button:active .icon {
            transform: scale(0.95);
        }

        .lydex {
            margin-top: 50px;

        }
    </style>
</head>

<body>
    <main>
        <h1 class="nabla-text">
            <span>W</span><span>o</span><span>r</span><span>l</span><span>d</span>
            <span>P</span><span>h</span><span>i</span><span>l</span><span>o</span><span>s</span><span>o</span><span>p</span><span>h</span><span>y</span>
            <span>D</span><span>a</span><span>y</span>
        </h1>
        <h1 style="font-size: 4vw;" class="lydex nabla-text">
            <span>L</span><span>Y</span><span>D</span><span>E</span><span>X</span>
            <span>d</span><span>e</span>
            <span>R</span><span>a</span><span>b</span><span>a</span><span>t</span>
        </h1>
    </main>

    <a class="cssbuttons-io-button" href="{{ url_for('index') }}">
        Get started
        <div class="icon">
            <svg height="24" width="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 0h24v24H0z" fill="none"></path>
                <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
                    fill="currentColor"></path>
            </svg>
        </div>
    </a>
</body>

</html>
